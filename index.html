<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" />

  <link rel="stylesheet" href="styles/estilos.css">
  <style>
   
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="poke-header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg"
         alt="Pokémon" class="poke-logo" />
    <div class="gen-selector">
      <label for="genSelect">Generación</label>
      <select id="genSelect">
        <option value="0,151">I — Kanto</option>
        <option value="151,100">II — Johto</option>
        <option value="251,135">III — Hoenn</option>
        <option value="386,107">IV — Sinnoh</option>
        <option value="493,156">V — Unova</option>
      </select>
    </div>
  </header>

  <!-- ── Loading ── -->
  <div id="loadingSpinner">
    <div class="spinner-ring"></div>
    <p style="color:var(--text-muted);margin-top:16px;font-size:.85rem;">Cargando Pokémon…</p>
  </div>

  <!-- ── Grid ── -->
  <div id="pokegrid"></div>

  <!-- ── Detail modal overlay ── -->
  <div id="detailOverlay" role="dialog" aria-modal="true" aria-label="Detalle del Pokémon">
    <div id="detailModal">
      <button class="modal-close" id="closeModal" aria-label="Cerrar">&times;</button>
      <div class="modal-banner" id="modalBanner">
        <p class="poke-id" id="modalId"></p>
        <img id="modalImg" class="modal-img" src="" alt="" />
        <h2 id="modalName"></h2>
      </div>
      <div class="modal-body-inner">
        <div class="info-row">
          <div class="info-item">
            <div class="label">Generación</div>
            <div class="value" id="modalGen">—</div>
          </div>
          <div class="info-item">
            <div class="label">Peso</div>
            <div class="value" id="modalWeight">—</div>
          </div>
          <div class="info-item">
            <div class="label">Altura</div>
            <div class="value" id="modalHeight">—</div>
          </div>
        </div>

        <div class="section-title">Tipos</div>
        <div id="modalTypes"></div>

        <div class="section-title">Habilidades</div>
        <div id="modalAbilities"></div>

        <div class="section-title">Movimientos</div>
        <div class="moves-wrap" id="modalMoves"></div>
      </div>
    </div>
  </div>
 <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="codes/codigo.js"></script>
  </body>
</html>
