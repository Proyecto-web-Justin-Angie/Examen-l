<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex - UTN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="styles/estilos.css" />
  </head>
  <body>
    <header class="poke-header">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pokémon_logo.svg"
        alt="Pokémon Logo"
        class="poke-logo"
      />

      <nav class="gen-selector">
        <a href="index.html" class="btn btn-danger btn-retro">Pokédex</a>
        <a href="pages/entrenadores.html" class="btn btn-dark btn-retro">Entrenadores</a>
        <a href="pages/equiposPokemon.html" class="btn btn-dark btn-retro">Equipos</a>
      </nav>

      <div class="gen-selector">
        <label for="genSelect" class="form-label">Generación</label>
        <select id="genSelect" class="form-select w-auto">
          <option value="0,151">I — Kanto</option>
          <option value="151,100">II — Johto</option>
          <option value="251,135">III — Hoenn</option>
          <option value="386,107">IV — Sinnoh</option>
          <option value="493,156">V — Unova</option>
        </select>
      </div>
    </header>

    <div id="loadingSpinner">
      <div class="spinner-ring"></div>
      <p class="subtitulo-blanco" style="margin-top: 16px; font-size: 0.85rem">
        Cargando Pokémon…
      </p>
    </div>

    <main id="pokegrid"></main>

    <div id="detailOverlay" role="dialog" aria-modal="true" aria-label="Detalle del Pokémon">
      <div id="detailModal" class="modal-content-custom">
        <button class="modal-close" id="closeModal" aria-label="Cerrar">&times;</button>
        
        <div class="modal-banner" id="modalBanner">
          <p class="poke-id-yellow" id="modalId"></p>
          <img id="modalImg" class="modal-img" src="" alt="Imagen del Pokémon"/>
          <h2 id="modalName"></h2>
        </div>

        <div class="modal-body-inner">
          <div class="info-row">
            <div class="info-item">
              <span class="label">Generación</span>
              <div class="subtitulo-blanco" id="modalGen">—</div>
            </div>
            <div class="info-item">
              <span class="label">Peso</span>
              <div class="subtitulo-blanco" id="modalWeight">—</div>
            </div>
            <div class="info-item">
              <span class="label">Altura</span>
              <div class="subtitulo-blanco" id="modalHeight">—</div>
            </div>
          </div>

          <h3 class="section-title">Tipos</h3>
          <div id="modalTypes"></div>

          <h3 class="section-title">Habilidades</h3>
          <div id="modalAbilities"></div>

          <h3 class="section-title">Movimientos</h3>
          <div class="moves-wrap" id="modalMoves"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="codes/database.js"></script>
    <script src="codes/pokedex.js"></script>
  </body>
</html>
